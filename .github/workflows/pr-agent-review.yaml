name: PR-Agent

# Review this repository's own pull requests with its published action (ghcr.io/<owner>/pr-agent:github_action).
# Requires the CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`); PR_AGENT_MODEL optionally picks the model.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent_job:
    # A cheap pre-filter only: the "Authorize comment command" step is the real gate.
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
          startsWith(github.event.comment.body, '/')
        )
      )
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Comment commands spend the subscription, so only users with write access may run them.
      - name: Authorize comment command
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOGIN: ${{ github.event.comment.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "issue_comment" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          role=$(gh api "repos/$GH_REPO/collaborators/$LOGIN/permission" --jq '.role_name' 2>/dev/null || echo none)
          case "$role" in
            admin|maintain|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::notice::Skipping: comment commands require write access"; echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Never executed: the model reads a copy of its tracked files (no .git) with Read/Grep/Glob only.
      - name: Check out the pull request for read-only exploration
        if: steps.authorize.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          persist-credentials: false

      # Pinned to main rather than `./`: `./` would load action.yaml from the pull request's checkout, letting a
      # pull request choose the image that receives the token.
      - name: Run PR-Agent
        if: steps.authorize.outputs.allowed == 'true'
        uses: tim-mcdonnell/pr-agent@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ secrets.PR_AGENT_MODEL }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONFIG__OUTPUT_RUN_DETAILS: 'true'
          # This repository's .pr_agent.toml is tuned for upstream's hosted reviews; don't apply it here.
          CONFIG__USE_REPO_SETTINGS_FILE: 'false'
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: 'true'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: 'true'
          GITHUB_ACTION_CONFIG__FAIL_ON_TOOL_ERRORS: 'true'
