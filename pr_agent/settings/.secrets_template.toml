# QUICKSTART:
# Copy this file to .secrets.toml in the same folder.
# Claude credentials come from the environment, not this file: set CLAUDE_CODE_OAUTH_TOKEN (from
# `claude setup-token`, billed to your Claude subscription) or ANTHROPIC_API_KEY. Locally, an existing
# `claude` login also works.
# Set github.deployment_type to "user" and github.user_token to your GitHub personal access token.
# This will allow you to run the pr-agent CLI and the github_polling server.
#
# See README for details about GitHub App deployment.

[openai]
key = ""  # Only for /similar_issue, which embeds issues with OpenAI embeddings. Acquire through https://platform.openai.com

[pinecone]
api_key = "..."
cloud = "aws"
region = "us-east-1"

[qdrant]
# For Qdrant Cloud or self-hosted Qdrant
url = ""  # e.g., https://xxxxxxxx-xxxxxxxx.eu-central-1-0.aws.cloud.qdrant.io
api_key = ""

[github]
# ---- Set the following only for deployment type == "user"
user_token = ""  # A GitHub personal access token with 'repo' scope.
deployment_type = "user" #set to user by default

# ---- Set the following only for deployment type == "app", see README for details.
private_key = """\
-----BEGIN RSA PRIVATE KEY-----
<GITHUB PRIVATE KEY>
-----END RSA PRIVATE KEY-----
"""
app_id = 123456  # The GitHub App ID, replace with your own.
webhook_secret = "<WEBHOOK SECRET>"  # Required. Webhooks are rejected with HTTP 403 when it is unset.

[gitlab]
# GitLab personal access token
personal_access_token = ""
shared_secret = ""  # webhook secret

[gitea]
# Gitea personal access token
personal_access_token=""
webhook_secret="" # webhook secret. Required. Webhooks are rejected with HTTP 403 when it is unset.

[otel]
# OpenTelemetry OTLP exporter configuration (optional)
# Only required if otel.exporter_type is set to "otlp" in configuration.toml
otlp_endpoint = ""  # OTLP base URL, e.g. "http://localhost:4318" or "https://api.honeycomb.io". With otlp_protocol="http" (default), "/v1/traces" and "/v1/metrics" are appended automatically; with "grpc" the endpoint is used as-is (typically port 4317).
otlp_headers = ""  # e.g., "x-honeycomb-team=YOUR_API_KEY" or "Authorization=Bearer YOUR_TOKEN"

[bitbucket]
# Public base URL of your Bitbucket app deployment. Required for the Bitbucket
# app: it is served in the Atlassian Connect descriptor and used as the expected
# JWT audience when validating incoming webhooks.
base_url = ""
# For Bitbucket app: the Atlassian Connect app key, also used as the JWT issuer
app_key = ""
# For Bitbucket authentication
auth_type = "bearer"  # "bearer" or "basic"
# For bearer token authentication
bearer_token = ""
# For basic authentication (uses token only)
basic_token = ""

[bitbucket_server]
# For Bitbucket Server bearer token
bearer_token = ""
webhook_secret = ""  # Required. Webhooks are rejected with HTTP 403 when it is unset.
# URL of your Bitbucket Server instance, e.g. https://git.bitbucket.com
url = ""

[asana]
# Bearer token used to fetch task details from the Asana API.
api_token = ""

[linear]
# Personal API key sent directly in Authorization (without the OAuth Bearer prefix).
api_token = ""

[azure_devops]
# For Azure devops personal access token
org = ""
pat = ""

[jira]
# For fetching ticket context from Jira Cloud (only Jira Cloud is supported)
jira_site = ""       # the "<site>" in https://<site>.atlassian.net (e.g. "your-org")
jira_api_email = ""  # Atlassian account email
jira_api_token = ""  # Atlassian API token

[azure_devops_server]
# For Azure devops Server basic auth - configured in the webhook creation
# Required for Azure devops webhooks (HTTP 403 until both are set). Value assigned when you create the webhook
# webhook_username = "<basic auth user>"
# webhook_password = "<basic auth password>"

[aws]
# When running on AWS compute (EC2, ECS, EKS, Lambda) with an IAM role attached,
# set AWS_USE_IMDS=true in the environment instead of providing static keys here.
# These keys are only needed as an optional fallback when AWS_USE_IMDS=true, or
# when running outside AWS compute without ambient credentials.
AWS_ACCESS_KEY_ID = ""
AWS_SECRET_ACCESS_KEY = ""
AWS_REGION_NAME = ""
AWS_SESSION_TOKEN = ""  # optional: only needed for STS-derived or temporary credentials

[aws_secrets_manager]
secret_arn = ""         # The ARN of the AWS Secrets Manager secret containing PR-Agent configuration
region_name = ""        # Optional: specific AWS region (defaults to AWS_REGION_NAME or Lambda region)
