name: 'PR-Agent for Claude'
description: 'Describe, review and suggest improvements for pull requests with Claude, run through Claude Code'
branding:
  icon: 'award'
  color: 'orange'
inputs:
  claude_code_oauth_token:
    description: 'Claude subscription token from `claude setup-token` (store it as a secret). Takes precedence over anthropic_api_key.'
    required: false
    default: ''
  anthropic_api_key:
    description: 'Claude Console API key, as an alternative to claude_code_oauth_token (store it as a secret).'
    required: false
    default: ''
  model:
    description: 'Claude Code model slug, e.g. opus, sonnet, haiku, sonnet[1m] or claude-opus-5-5. Empty uses config.model.'
    required: false
    default: ''
  fallback_models:
    description: 'Comma-separated Claude Code model slugs tried in order when the model fails. Empty uses config.fallback_models.'
    required: false
    default: ''
  artifact_path:
    description: 'Path to a CI artifact file (relative to GITHUB_WORKSPACE or absolute) to include as extra context in PR analysis. Leave empty to disable artifact injection.'
    required: false
    default: ''
  artifact_instructions:
    description: 'Custom instructions telling the AI how to interpret the artifact. Leave empty for a sensible default.'
    required: false
    default: ''
runs:
  using: 'docker'
  # Built and published by .github/workflows/docker-image.yml. For a reproducible run, pin this action by commit
  # SHA and the image by digest instead: docker://ghcr.io/tim-mcdonnell/pr-agent@sha256:<digest>.
  image: 'docker://ghcr.io/tim-mcdonnell/pr-agent:github_action'
  env:
    ARTIFACT_PATH: ${{ inputs.artifact_path }}
    ARTIFACT_INSTRUCTIONS: ${{ inputs.artifact_instructions }}
